name: hive-core-cli-release
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-release:
    if: github.event.release.target_commitish == 'master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build -p hive-core-cli -p hive-core-pairing -p hive-desktop-cli --release --locked
      - name: Package hive-core-cli tarball
        run: tar -czf hive-core-cli-x86_64-unknown-linux-gnu.tar.gz -C target/release hive-core
      - name: Package hive-core-pairing tarball
        run: tar -czf hive-core-pairing-x86_64-unknown-linux-gnu.tar.gz -C target/release hive-core-pairing
      - name: Package hive-desktop-cli tarball
        run: tar -czf hive-desktop-cli-x86_64-unknown-linux-gnu.tar.gz -C target/release hive-desktop-cli
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hive-core-cli-x86_64-unknown-linux-gnu.tar.gz
            hive-core-pairing-x86_64-unknown-linux-gnu.tar.gz
            hive-desktop-cli-x86_64-unknown-linux-gnu.tar.gz
