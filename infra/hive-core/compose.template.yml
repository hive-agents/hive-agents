services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      [
        "server",
        "-s3",
        "-dir=/data",
        "-s3.port=8333",
        "-s3.config=/etc/seaweedfs/s3.json",
      ]
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:8888:8888"
    volumes:
      - ./data/seaweed:/data
      - ./state/seaweedfs:/etc/seaweedfs:ro

  pairing:
    image: debian:bookworm-slim
    restart: unless-stopped
    command:
      [
        "/opt/hive-core/bin/hive-core-pairing",
        "--root",
        "/opt/hive-core",
        "--listen",
        "0.0.0.0:8081",
        "--authorized-keys",
        "/home/hive/.ssh/authorized_keys",
      ]
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./state:/opt/hive-core/state
      - ./bin:/opt/hive-core/bin:ro
      - ./.env:/opt/hive-core/.env:ro
      - /home/hive/.ssh:/home/hive/.ssh
